# journey.yml — v1 vertical slice: "From the map to the tidal signal"
# AI-generated draft (Claude, Anthropic) — for review.
#
# Constitution VII invariant (enforced by tests/test_structure.py):
#   every step with coding_skills MUST also name domain.concepts AND chapters.
#   No free-floating coding. Coding enters only attached to a domain question.
#
# Cross-refs: coding_skills -> skill_maps/slice_v1.yml -> content/skill_to_chapter.yml
#             probes        -> assessment/probes/<id>.md

slice:
  id: slice_v1
  title: "From the map to the tidal signal"
  end_state: >
    The student has touched 0a/0b/0c domain concepts AND used Jupyter, Python,
    matplotlib, xarray, and pandas — each in service of a real question — landing
    at the doorstep of the thermal / diffuse-flow projects (tmpsf, magma2vents).

  # Progressive gating: modules unlock in order. A module opens only when the
  # previous module's gate is cleared. On a FAILED gate, remediate (drop to full
  # scaffold, walk the hint ladders, re-attempt the capstone) — do NOT advance.
  progression:
    start_unlocked: [0]
    rule: "step N+1 unlocks iff step N gate cleared; failure → remediate in place, never skip ahead"

  steps:
    - n: 0
      name: "Get to the data"
      tier: "0"
      domain:
        concepts: [filesystem_navigation]
        question: "How do you reach the machine where Axial's data lives, find the staged grid, and peek inside a file?"
      coding_skills: [unix_basics, vi_basics]
      chapters: [unix_basics]    # unix from the book; vi has no book chapter — sourced as a reading
      readings: [vi_ref]         # Wikibooks "Learning the vi Editor" (CC BY-SA 4.0) — see readings.md
      warmup: shell_warmup       # content/shell_warmup.md — guided terminal practice (NOT graded) before the capstone
      data: [axial_bathymetry_gmrt.nc, plate_boundary.csv]
      probes: [p00_unix_navigate, p00c_shell_peek, p00d_read_error, p00b_vi_edit]
      capstone: "From the JupyterLab terminal, all by tab-completion, demonstrate the three navigation musts: (1) UP/DOWN — go down into a subdir and back up (e.g. cd ~/student-onramp/assessment/probes, then cd ../.. — pwd after each); (2) the TILDE — reach the data dir from wherever you are via an absolute ~ path (cd ~/student-onramp/data); (3) IDENTIFY THE PATH — before one of those cd's, predict the full path you'll land in, then pwd to check. Then in data/: ls -lh the staged grid, peek at plate_boundary.csv's header with head, open it in vi, read the header, and exit cleanly without saving."
      gate:
        must: "Capstone done — judged on the demonstration itself, NOT the pre-teaching probe scores. The student demonstrated all three navigation musts by tab-completion: (1) UP AND DOWN — descended into a subdir and climbed back up (.., ../..); (2) the TILDE — reached a target from anywhere via ~ (and knows bare cd / cd ~ = home); (3) IDENTIFY THE PATHWAY — predicted a cd's resulting absolute path, then confirmed with pwd (absolute vs relative). Plus: ls -lh the grid, head a file, and opened a file in vi and exited cleanly. A fluent (Proficient) student may demonstrate this quickly and move on; anyone who struggles drops to the full navigation drill (content/shell_warmup.md), repeats until easy, and re-attempts — do NOT advance on a shaky demonstration. (Probe scores are the pre-teaching baseline; the capstone is the post-teaching check.)"
        unlocks: 1

    - n: 1
      name: "Locate it"
      tier: "0a"
      domain:
        concepts: [latitude_longitude, earth_topography]
        question: "Where on Earth is Axial Seamount, and what does its seafloor look like?"
      coding_skills: [jupyter_basics, python_fundamentals, matplotlib_plot]
      chapters: [jupyter_basics, python_fundamentals, numpy_matplotlib]
      readings: [lab2]
      enrichment: [geomapapp]    # OPTIONAL no-code visual primer (same GMRT data); never gating
      data: [axial_bathymetry_gmrt.nc, plate_boundary.csv]
      note: "Three chapters here (JupyterLab, Python, numpy/matplotlib) — verify each with its own probe (run-a-cell, Python indexing, the plot), not only the final plot. The capstone also needs axis-limiting (xlim/ylim or imshow extent=) and the boundary overlay, which the linked chapters don't cover deeply — teach those in one line at the capstone. Before the first cell, surface content/jupyter_survival_card.md and cover the notebook gotchas real students hit (H3/H4): create the notebook INSIDE the repo (relative paths), pick the `ooi` kernel (base env lacks xarray/netCDF4), Ctrl+S to save, and Kernel>Restart on a stale [*]/hung kernel."
      survival_card: jupyter_survival_card    # content/jupyter_survival_card.md — keep-it-open (any treatment)
      probes: [p01_meters_per_degree, p02a_jupyter_basics, p02b_python_fundamentals, p02_matplotlib_bathy]
      capstone: "Plot Axial's location + bathymetry from the staged grid, boundary overlaid. (Heads-up: plate_boundary.csv spans the whole NE Pacific — limit your axes to the grid's extent.)"
      gate:
        must: "Capstone done — bathymetry image produced WITH a colorbar; meters-per-degree understood (p01/p02 not `wrong`)."
        unlocks: 2

    - n: 2
      name: "Why it's there"
      tier: "0b"
      domain:
        concepts: [plate_tectonics, seafloor_spreading, ooi_observatory]
        question: "Why is there a volcano here, and why did OOI wire it with sensors?"
      coding_skills: []          # conceptual — Socratic Q&A + light reading (Constitution VI)
      chapters: []
      readings: [lab3, lab1]
      note: "Before the capstone, explicitly CONTRAST the two magma sources — decompression melting (plate spreading lowers pressure → mantle melts) vs a hotspot/thermal plume (extra heat from below). Both make magma but by different causes; students conflate them. Lay them side by side, then connect both to Axial's frequent eruptions."
      probes: [p03_why_axial]
      # capstone deliberately goes one notch past p03 (same key concepts, applied
      # framing) — a Proficient student must not get the probe verbatim again (P4 run defect D1)
      capstone: "Connect Axial's double magma supply (spreading ridge + hotspot) to its frequent eruptions — and name one thing a cabled real-time observatory catches that a yearly ship visit would miss."
      gate:
        must: "Capstone done — sound why-Axial + why-OOI explanation (p03 `correct` or `partial`)."
        unlocks: 3

    - n: 3
      name: "Get the data"
      tier: "0b"
      domain:
        concepts: [ooi_data_collection]
        question: "How does a cabled observatory get ocean data to your laptop?"
      coding_skills: [xarray_intro, data_access]
      chapters: [xarray_intro]
      readings: [lab1]
      data: [axial_tmpsf_2015-01.nc]
      note: "Frame xarray as 'labeled data' — a grid that knows its axis names (time, sensor); preview dims/coords/data_vars gently before the capstone so it doesn't land cold."
      probes: [p04_xarray_inspect]
      capstone: "Open data/axial_tmpsf_2015-01.nc with xarray; report its dims (time, sensor), coords, and the temperature variable — then DO something with it: select one sensor (or slice a one-day time window) and report the resulting shape plus a couple of temperature values."
      gate:
        must: "Capstone done — opened the dataset, reported its dims/coords/variables, AND performed a selection or time-slice and reported the resulting shape (p04 not `wrong`)."
        unlocks: 4

    - n: 4
      name: "See the science"
      tier: "0c"
      domain:
        concepts: [seafloor_tides, tidal_modulation_vents]
        question: "Is there a tide on the seafloor — and can you see it in the data?"
      coding_skills: [pandas_timeseries, resample_plot]
      chapters: [pandas_intro, pandas_basics]
      readings: [lab4, tidal_nugget]
      data: [axial_botpt_2015-01.parquet]
      note: "pd.read_parquet(path) loads the file into a DataFrame just like pd.read_csv — same DataFrame, datetime index already set; teach it in one line at the capstone."
      probes: [p05_pandas_resample]
      capstone: "Load data/axial_botpt_2015-01.parquet, resample bottom_pressure_psi to hourly, and reveal the M2 (~12.4 h) tidal signal; describe it."
      gate:
        must: "Capstone done — resampled bottom pressure and identified the ~12.4 h (M2) tide (p05 `correct` or `partial`)."
        unlocks: end   # reaches the doorstep of tmpsf / magma2vents (slice complete)
      bridge: >
        Tidal loading also modulates diffuse vent flow — the very question the
        tmpsf / magma2vents projects pursue. You're now at their doorstep.
