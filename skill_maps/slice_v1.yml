# slice_v1.yml — target competencies for the v1 slice (domain + coding).
# AI-generated draft (Claude, Anthropic) — for review.
#
# Each competency is probed and leveled Novice/Developing/Proficient (assessment/rubric.md).
# `chapter` keys resolve in content/skill_to_chapter.yml; `probes` resolve in assessment/probes/.

domain:
  - id: filesystem_navigation
    step: 0
    summary: "Reaches the machine where data lives; finds and inspects files from the shell before code touches them."
    probes: [p00_unix_navigate]
  - id: latitude_longitude
    step: 1
    summary: "Reads lat/long; has meters-per-degree intuition (1 deg lat ~111 km; lon shrinks with cos(lat))."
    probes: [p01_meters_per_degree]
  - id: earth_topography
    step: 1
    summary: "Understands the seafloor has relief; bathymetry is a depth map."
    probes: [p01_meters_per_degree, p02_matplotlib_bathy]
  - id: plate_tectonics_ooi
    step: 2
    summary: "Connects spreading center -> volcanism at Axial -> why OOI instruments it."
    probes: [p03_why_axial]
  - id: ooi_data_collection
    step: 3
    summary: "Knows a cabled observatory streams sensor data retrievable as files/datasets."
    probes: [p04_xarray_inspect]
  - id: seafloor_tides
    step: 4
    summary: "Tides reach the seafloor; the dominant lunar semidiurnal (M2) period is ~12.4 h."
    probes: [p05_pandas_resample]

coding:
  - id: unix_basics
    step: 0
    chapter: unix_basics
    # GATING objectives: orient (pwd, ls -lh) · navigate (cd, ~, .., tab-complete) ·
    #   peek at a file without an editor (head/cat) · read & recover from a shell error.
    # USEFUL (taught, not gating): organize (mkdir/cp/mv) · rm + "no trash bin" · globbing (* ?) ·
    #   inspect more (less, wc -l, grep) · combine + redirect (pipe |, > >>) · self-serve (man, --help).
    #   These are the "Part 2 — handy extras" block of content/shell_warmup.md + the survival card.
    summary: "Survival shell: orient (pwd/ls), navigate (cd/~/..), peek at a file (head/cat), and read+recover from errors like 'No such file or directory' — enough to reach and inspect data."
    probes: [p00_unix_navigate, p00c_shell_peek, p00d_read_error]
  - id: vi_basics
    step: 0
    reading: vi_ref           # external (no book chapter) — Wikibooks vi reference; resolves in journey/readings.md
    # GATING objectives: modal model (normal vs insert) · open (vi <file>) · insert (i) ·
    #   back to normal (Esc) · leave deliberately (:wq / :q / :q!) · the bail reflex (Esc then :q!).
    # USEFUL (taught, not gating): movement (hjkl/arrows) · delete (x/dd) · yank+put (yy/p) · search (/).
    summary: "Survival vi: the modal model (normal vs insert), open a file, insert (i), Esc, and leave deliberately (:wq/:q/:q!) — never get trapped."
    probes: [p00b_vi_edit]
  - id: two_prompts
    step: 0
    chapter: unix_basics      # the shell half; Claude Code has no book chapter — sourced as reading `claude_code_ref`
    reading: claude_code_ref  # Claude Code quickstart (public docs); resolves in journey/readings.md
    # GATING objectives: tell the two terminal tabs apart by their prompt ($ = shell, > = Claude) ·
    #   route each thing typed — commands to the shell tab, questions/predictions/reports to Claude ·
    #   say which tab you are in at any moment · know Claude is a program running in a tab
    #   (`claude` enters, /exit leaves), the same modal idea as vi.
    # USEFUL (taught, not gating): open a second terminal tab in JupyterLab (File > New > Terminal) ·
    #   recognize a mis-route (`command not found` at the shell; an unrun command at Claude) ·
    #   `pwd` as the which-tab test.
    summary: "Two tabs, two prompts: tells the shell tab ($, runs commands, answers with output) from the Claude tab (>, reads sentences, answers with words); sends each thing typed to the right one; can say which tab they are in at any moment."
    probes: [p00e_which_prompt]
  - id: jupyter_basics
    step: 1
    chapter: jupyter_basics
    summary: "Runs cells, restarts kernel, reads tracebacks in JupyterLab."
    probes: [p02a_jupyter_basics]
  - id: python_fundamentals
    step: 1
    chapter: python_fundamentals
    summary: "Variables, lists, indexing, calling functions, importing modules."
    probes: [p02b_python_fundamentals]
  - id: matplotlib_plot
    step: 1
    chapter: numpy_matplotlib
    summary: "Displays a 2D array as an image with a colorbar; labels axes."
    probes: [p02_matplotlib_bathy]
  - id: xarray_intro
    step: 3
    chapter: xarray_intro
    summary: "Opens a dataset; inspects dims, coords, variables; selects a variable."
    probes: [p04_xarray_inspect]
  - id: pandas_timeseries
    step: 4
    chapter: pandas_intro
    summary: "Datetime-indexed DataFrame; resample to a frequency; plot a series."
    probes: [p05_pandas_resample]
